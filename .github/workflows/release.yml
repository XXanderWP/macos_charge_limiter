# Builds ChargeLimiter.app on every version tag (v1.2.3) and attaches it to a GitHub release.
# install.sh downloads releases/latest/download/ChargeLimiter.zip.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: app/build.sh "${GITHUB_REF_NAME#v}" "$PWD/build"

      - name: Package
        run: ditto -c -k --keepParent build/ChargeLimiter.app ChargeLimiter.zip

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" ChargeLimiter.zip --title "$GITHUB_REF_NAME" --generate-notes
